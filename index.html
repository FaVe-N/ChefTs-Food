    />
    <link rel="stylesheet" href="styles.css" />
    <title>Home</title>
  </head>
  <body>
    <!-- header -->
    <header>
      <nav class="nav">
        <div class="nav__links">
          <ul>
            <li class="nav__link active">
              <a href="index.html"><i class="fi fi-rr-home"></i>Home</a>
            </li>
            <li class="nav__link">
              <a href="about.html"><i class="fi fi-rr-user"></i>About</a>
            </li>
            <li class="nav__link">
              <a href="menu.html"><i class="fi fi-rr-restaurant"></i>Menu</a>
            </li>
            <li class="nav__link">
              <a href="gallery.html"><i class="fi fi-rr-camera"></i>Gallery</a>

            <li class="nav__link">

            <li class="nav__link">
              <a href="" class="close-menu"
                ><i class="fi fi-rr-circle-xmark"></i

    <!-- main -->
    <main>

          <img src="assets/img/logo.png" alt="logo image" />

        <div class="hero__content">
          <h1 class="hero__text">
            <span>Taste</span> the <span>Home</span> <br />
            You've Been Missing
          </h1>
          <a href="#" class="btn pry"
            ><img
              src="assets/icons/whatsapp-svgrepo-com.svg"
              alt="whatsapp logo" />ORDER ON WHATSAPP

          ></a>
        </div>
      </section>

    <!-- footer -->
    <footer class="footer">
      <div class="footer__content">
        <div class="footer__details">
          <div class="footer__sub-details">
            <p class="title">Address</p>
            <p class="text">
              24 Orchid road, Off Awolowo <br />
              Street, Ikoyi, Lagos State
            </p>
          </div>
          <div class="footer__sub-details">
            <p class="title">Hours</p>
            <p class="text">Mon - Fri: 09:00 - 7pm</p>
          </div>
          <div class="footer__sub-details">
            <p class="title">Phone</p>
            <p class="text">+234 9012 345 678</p>
          </div>
          <div class="footer__sub-details">
            <p class="title">Socials</p>
            <div class="footer__icons">
              <ul>
                <li>
                  <a href="#" class="footer__icon"

                  /></a>
                </li>
                <li>
                  <a href="#" class="footer__icon"

                  /></a>
                </li>
                <li>
                  <a href="#" class="footer__icon"
                    ><img src="assets/icons/linkedin-svgrepo-com 1.png" alt=""
                  /></a>
                </li>
                <li>
                  <a href="#" class="footer__icon"
                    ><img src="assets/icons/mingcute_tiktok-line.png" alt=""
                  /></a>
                </li>
              </ul>
            </div>
          </div>
        </div>
        <div class="footer__copyright">
          <p class="copyright">© 2026 Uncle Nedu’s Kitchen</p>
        </div>
